<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#pawGrad)" />
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Main pad -->
    <ellipse cx="50" cy="65" rx="19" ry="15" />
    <!-- Top-left toe -->
    <ellipse cx="28" cy="40" rx="9" ry="13" transform="rotate(-15 28 40)" />
    <!-- Top-mid-left toe -->
    <ellipse cx="43" cy="32" rx="9" ry="14" transform="rotate(-5 43 32)" />
    <!-- Top-mid-right toe -->
    <ellipse cx="57" cy="32" rx="9" ry="14" transform="rotate(5 57 32)" />
    <!-- Top-right toe -->
    <ellipse cx="72" cy="40" rx="9" ry="13" transform="rotate(15 72 40)" />
  </g>
</svg>
