<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Subtle circular badge background -->
  <circle cx="256" cy="256" r="190" fill="white" opacity="0.1" />

  <!-- Paw Print Main Shape -->
  <g fill="white" filter="url(#drop)">
    <!-- Central Pad -->
    <path d="M 256 260 C 200 260 170 300 175 350 C 180 395 215 410 256 410 C 297 410 332 395 337 350 C 342 300 312 260 256 260 Z" />
    
    <!-- Outer Left Toe -->
    <ellipse cx="150" cy="225" rx="42" ry="60" transform="rotate(-24 150 225)" />
    
    <!-- Inner Left Toe -->
    <ellipse cx="218" cy="170" rx="38" ry="64" transform="rotate(-8 218 170)" />
    
    <!-- Inner Right Toe -->
    <ellipse cx="294" cy="170" rx="38" ry="64" transform="rotate(8 294 170)" />
    
    <!-- Outer Right Toe -->
    <ellipse cx="362" cy="225" rx="42" ry="60" transform="rotate(24 362 225)" />
  </g>

  <!-- Small Plus / Cross medical accent on the pad in warm gold -->
  <g fill="url(#accent)">
    <circle cx="256" cy="340" r="28" fill="#4f46e5" />
    <path d="M 252 324 H 260 V 356 H 252 Z" fill="url(#accent)" />
    <path d="M 240 336 H 272 V 344 H 240 Z" fill="url(#accent)" />
  </g>
</svg>
